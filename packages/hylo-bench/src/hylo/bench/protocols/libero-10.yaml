schema_version: hylo.protocol/v0.1
name: libero-10
version: "1"
description: |
  LIBERO-10 (long-horizon), the official protocol: all 50 stored init states of each of the 10 tasks (500 episodes).
  These include the init states improvement campaigns develop on (RFC-0002 search 0-19, search_val 20-29, gate
  30-39); for a policy improved by a campaign on LIBERO-10, report libero-10-heldout instead.
benchmark: {type: libero, split: heldout, params: {suite: libero_10, n_validation: 0, n_heldout: 50}}
env:
  type: libero
  remote: {runtime: libero-sim}
trace: {record_privileged: true, image_every: 10}
workers: 24
requires: [hylo-env-libero, "envs/libero/setup.sh (LIBERO + LeRobot venv)"]
