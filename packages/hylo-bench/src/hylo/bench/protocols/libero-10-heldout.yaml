schema_version: hylo.protocol/v0.1
name: libero-10-heldout
version: "1"
description: |
  LIBERO-10 on the RFC-0002 held-out init states only (40-49 of each task, 100 episodes): never read by learners
  or the gate, so it stays a fair test for policies improved by campaigns.
benchmark: {type: libero, split: heldout, params: {suite: libero_10, protocol: rsi}}
env:
  type: libero
  remote: {runtime: libero-sim}
trace: {record_privileged: true, image_every: 10}
workers: 24
requires: [hylo-env-libero, "envs/libero/setup.sh (LIBERO + LeRobot venv)"]
