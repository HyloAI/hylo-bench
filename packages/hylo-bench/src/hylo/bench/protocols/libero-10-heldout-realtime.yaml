schema_version: hylo.protocol/v0.1
name: libero-10-heldout-realtime
version: "1"
description: |
  libero-10-heldout as a robot would run it: the simulated arm keeps executing while the policy computes its next
  chunk (realtime timing on the virtual clock), stale actions are dropped and gaps are held. Latency is fixed at
  0.5 s per chunk (a GPU policy server), not measured: a measured latency depends on the machine and its load,
  and the protocol must mean the same thing everywhere. The gap to libero-10-heldout is what deployment costs.
benchmark: {type: libero, split: heldout, params: {suite: libero_10, protocol: rsi}}
env:
  type: libero
  remote: {runtime: libero-sim}
trace: {record_privileged: true, image_every: 10}
timing: {mode: realtime, clock: virtual, latency_s: 0.5, refill_steps: 2}     # the arm keeps moving for 0.5 s per chunk
workers: 24
requires: [hylo-env-libero, "envs/libero/setup.sh (LIBERO + LeRobot venv)"]
