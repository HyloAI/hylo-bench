[project]
name = "hylo-bench"
version = "0.1.0.dev0"
description = "Hylo benchmarking: fixed evaluation protocols, scorecards, leaderboards and pairwise comparison (hylo bench)"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-eval", "pyyaml>=6"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.commands"]
bench = "hylo.bench.cli:main"

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-eval = { workspace = true }
