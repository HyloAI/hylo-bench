[project]
name = "wc-bench"
version = "0.1.0.dev0"
description = "worldcurrent benchmarking: fixed evaluation protocols, scorecards, leaderboards and pairwise comparison (wc bench)"
requires-python = ">=3.10"
dependencies = ["wc-core", "wc-eval", "pyyaml>=6"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[project.entry-points."worldcurrent.commands"]
bench = "worldcurrent.bench.cli:main"

[tool.uv.sources]
wc-core = { workspace = true }
wc-eval = { workspace = true }
