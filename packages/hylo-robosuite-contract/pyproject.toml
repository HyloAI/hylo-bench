[project]
name = "hylo-robosuite-contract"
version = "0.1.0.dev0"
description = "The robot contract (hylo.robot/v0.1) on robosuite-based simulators: camera conventions, Panda model export and TCP, segmentation, joint-position control and a base environment class shared by the robosuite and RoboCasa adapters"
requires-python = ">=3.10"
dependencies = ["hylo-core"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[tool.uv.sources]
hylo-core = { workspace = true }
