[project]
name = "wc-env-mujoco"
version = "0.1.0.dev0"
description = "worldcurrent MuJoCo environment adapter and task set"
requires-python = ">=3.10"
dependencies = ["wc-core", "wc-eval", "mujoco>=3.1"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcurrent"]

[project.entry-points."worldcurrent.envs"]
"mujoco.planar_reach" = "worldcurrent.envs.mujoco.planar_reach:PlanarReachEnv"
"mujoco.table_reach" = "worldcurrent.envs.mujoco.table_reach:TableReachEnv"

[project.entry-points."worldcurrent.benchmarks"]
"mujoco/reach-v0" = "worldcurrent.envs.mujoco.planar_reach:mujoco_benchmark"
"mujoco/table-v0" = "worldcurrent.envs.mujoco.table_reach:table_benchmark"

[tool.uv.sources]
wc-core = { workspace = true }
wc-eval = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-env-mujoco" = "worldcurrent.envs.mujoco:META"
