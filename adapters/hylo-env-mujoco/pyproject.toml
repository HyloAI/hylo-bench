[project]
name = "hylo-env-mujoco"
version = "0.1.0.dev0"
description = "Hylo MuJoCo environment adapter and task set"
requires-python = ">=3.10"
dependencies = ["hylo-core", "mujoco>=3.1"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.envs"]
"mujoco.planar_reach" = "hylo.envs.mujoco.planar_reach:PlanarReachEnv"
"mujoco.table_reach" = "hylo.envs.mujoco.table_reach:TableReachEnv"

[project.entry-points."hylo.benchmarks"]
"mujoco/reach-v0" = "hylo.envs.mujoco.planar_reach:mujoco_benchmark"
"mujoco/table-v0" = "hylo.envs.mujoco.table_reach:table_benchmark"

[tool.uv.sources]
hylo-core = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-env-mujoco" = "hylo.envs.mujoco:META"
