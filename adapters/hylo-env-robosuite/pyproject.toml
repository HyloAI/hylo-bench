[project]
name = "hylo-env-robosuite"
version = "0.1.0.dev0"
description = "Hylo robosuite environment adapter (runs out of process in its own venv) and robosuite benchmark tasks with the robot contract"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-robosuite-contract"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.envs"]
"robosuite" = "hylo.envs.robosuite.env:RobosuiteEnv"

[project.entry-points."hylo.benchmarks"]
"robosuite" = "hylo.envs.robosuite.suites:robosuite_benchmark"

[project.entry-points."hylo.meta"]
"hylo-env-robosuite" = "hylo.envs.robosuite:META"

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-robosuite-contract = { workspace = true }
