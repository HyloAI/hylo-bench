[project]
name = "hylo-env-libero"
version = "0.1.0.dev0"
description = "Hylo LIBERO environment adapter (runs out of process in its own venv) and LIBERO benchmarks"
requires-python = ">=3.10"
dependencies = ["hylo-core"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.envs"]
"libero" = "hylo.envs.libero.env:LiberoEnv"

[project.entry-points."hylo.benchmarks"]
"libero" = "hylo.envs.libero.suites:libero_benchmark"

[tool.uv.sources]
hylo-core = { workspace = true }

[project.entry-points."hylo.meta"]
"hylo-env-libero" = "hylo.envs.libero:META"
