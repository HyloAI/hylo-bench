[project]
name = "hylo-env-robocasa"
version = "0.1.0.dev0"
description = "Hylo RoboCasa environment adapter (kitchen tasks on robosuite; runs out of process in its own venv) with the robot contract"
requires-python = ">=3.10"
dependencies = ["hylo-core", "hylo-robosuite-contract"]
license = "Apache-2.0"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hylo"]

[project.entry-points."hylo.envs"]
"robocasa" = "hylo.envs.robocasa.env:RoboCasaEnv"

[project.entry-points."hylo.benchmarks"]
"robocasa" = "hylo.envs.robocasa.suites:robocasa_benchmark"

[project.entry-points."hylo.meta"]
"hylo-env-robocasa" = "hylo.envs.robocasa:META"

[tool.uv.sources]
hylo-core = { workspace = true }
hylo-robosuite-contract = { workspace = true }
