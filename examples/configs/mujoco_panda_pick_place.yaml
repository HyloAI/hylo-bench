# Franka Panda at a table (mujoco/manip-v0, RFC-0006 part 3): put a named block or cylinder on a named plate.
# The privileged oracle (object poses from the simulator) is the upper bound for this task; tool-using agents run
# with cameras instead: env params {cameras: [front, side, wrist], segmentation: true} need MUJOCO_GL=egl or osmesa.
schema_version: hylo.experiment/v0.1
name: mujoco-panda-pick-place
benchmark: {type: mujoco/manip-v0, params: {tasks: [pick_place]}, split: validation}
env: {type: mujoco.panda_table, params: {cameras: [], privileged_obs: true}}
agent: {type: oracle.panda_table}
output_dir: runs
